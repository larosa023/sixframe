[build]
  publish = "."
  command = "node tools/fetch-frames.mjs"

[build.environment]
  NODE_VERSION = "20"

# Rebuild daily is not needed: the day rolls over in each visitor's browser.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
